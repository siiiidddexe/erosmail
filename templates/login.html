<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ErosMail</title>
    <meta name="description" content="Sign in to ErosMail Campaign Manager">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes logoFade {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }
        .card       { will-change: transform, opacity; animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
        .logo       { will-change: transform, opacity; animation: logoFade 0.6s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
        .logo-dark  { filter: brightness(0); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8 logo">
            <img src="/static/logo.png" alt="ErosMail" class="h-8 w-auto mx-auto logo-dark">
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-8 py-8 card">
            <h1 class="text-lg font-semibold text-gray-900 mb-1">Sign in</h1>
            <p class="text-sm text-gray-400 mb-6">Campaign Manager</p>

            {% if error %}
            <div class="bg-red-50 border border-red-100 text-red-600 rounded-lg px-4 py-3 text-sm mb-5 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" id="username" required autofocus placeholder="admin"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300 transition-shadow">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300 transition-shadow">
                </div>
                <button type="submit"
                    class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-700 active:scale-[0.98] transition-all mt-2">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-6">ErosMail — Professional Email Campaign Manager</p>
    </div>
</body>
</html>
