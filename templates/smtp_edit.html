{% extends "base.html" %}

{% block title %}Edit SMTP Account{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <a href="/smtp" class="text-indigo-600 hover:text-indigo-900">
            <svg class="inline h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to SMTP Accounts
        </a>
    </div>

    <div class="bg-white shadow sm:rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Edit SMTP Account</h3>
            <p class="mt-1 text-sm text-gray-500">Update configuration for SMTP sending account.</p>

            <form action="/smtp/{{ account.id }}/update" method="POST" class="mt-6 space-y-6">
                <div class="grid grid-cols-6 gap-6">
                    <div class="col-span-6 sm:col-span-3">
                        <label for="name" class="block text-sm font-medium text-gray-700">Account Name</label>
                        <input type="text" name="name" id="name" value="{{ account.name }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6 sm:col-span-3">
                        <label for="host" class="block text-sm font-medium text-gray-700">SMTP Host</label>
                        <input type="text" name="host" id="host" value="{{ account.host }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6 sm:col-span-2">
                        <label for="port" class="block text-sm font-medium text-gray-700">Port</label>
                        <input type="number" name="port" id="port" value="{{ account.port }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6 sm:col-span-4">
                        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" name="username" id="username" value="{{ account.username }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" name="password" id="password" value="{{ account.password }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6 sm:col-span-3">
                        <label for="rate_limit_per_hour" class="block text-sm font-medium text-gray-700">Rate Limit (per hour)</label>
                        <input type="number" name="rate_limit_per_hour" id="rate_limit_per_hour" value="{{ account.rate_limit_per_hour }}" min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                    <div class="col-span-6 sm:col-span-3">
                        <label for="rate_limit_per_day" class="block text-sm font-medium text-gray-700">Rate Limit (per day)</label>
                        <input type="number" name="rate_limit_per_day" id="rate_limit_per_day" value="{{ account.rate_limit_per_day }}" min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <a href="/smtp" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Update Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
