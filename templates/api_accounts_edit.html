{% extends "base.html" %}

{% block title %}Edit API Account{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <a href="/api-accounts" class="text-indigo-600 hover:text-indigo-900">
            <svg class="inline h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to API Accounts
        </a>
    </div>

    <div class="bg-white shadow sm:rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Edit API Account</h3>
            <p class="mt-1 text-sm text-gray-500">Update configuration for API sending account (NexoMailer, Custom API).</p>

            <form action="/api-accounts/{{ account.id }}/update" method="POST" class="mt-6 space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Account Name</label>
                    <input type="text" name="name" id="name" value="{{ account.name }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                </div>

                <div>
                    <label for="provider" class="block text-sm font-medium text-gray-700">Provider</label>
                    <select name="provider" id="provider" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                        <option value="nexomailer" {% if account.provider == 'nexomailer' %}selected{% endif %}>NexoMailer</option>
                        <option value="custom" {% if account.provider == 'custom' %}selected{% endif %}>Custom API</option>
                    </select>
                </div>

                <div>
                    <label for="api_key" class="block text-sm font-medium text-gray-700">API Key</label>
                    <input type="text" name="api_key" id="api_key" value="{{ account.api_key }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                </div>

                <div>
                    <label for="api_url" class="block text-sm font-medium text-gray-700">API URL</label>
                    <input type="url" name="api_url" id="api_url" value="{{ account.api_url or 'https://nexomail.logiclaunch.in' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="rate_limit_per_hour" class="block text-sm font-medium text-gray-700">Hourly Limit</label>
                        <input type="number" name="rate_limit_per_hour" id="rate_limit_per_hour" value="{{ account.rate_limit_per_hour }}" min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                        <p class="mt-1 text-xs text-gray-500">Max emails per hour</p>
                    </div>

                    <div>
                        <label for="rate_limit_per_day" class="block text-sm font-medium text-gray-700">Daily Limit</label>
                        <input type="number" name="rate_limit_per_day" id="rate_limit_per_day" value="{{ account.rate_limit_per_day }}" min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                        <p class="mt-1 text-xs text-gray-500">Max emails per day</p>
                    </div>
                </div>

                <div id="custom_fields" class="{% if account.provider != 'custom' %}hidden{% endif %} space-y-4">
                    <div>
                        <label for="custom_endpoint" class="block text-sm font-medium text-gray-700">Custom Endpoint URL</label>
                        <input type="url" name="custom_endpoint" id="custom_endpoint" value="{{ account.custom_endpoint or '' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                    </div>

                    <div>
                        <label for="custom_headers" class="block text-sm font-medium text-gray-700">Custom Headers (JSON)</label>
                        <textarea name="custom_headers" id="custom_headers" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder='{"Authorization": "Bearer token"}'>{{ account.custom_headers or '' }}</textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <a href="/api-accounts" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Update Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('provider').addEventListener('change', function() {
    const customFields = document.getElementById('custom_fields');
    if (this.value === 'custom') {
        customFields.classList.remove('hidden');
    } else {
        customFields.classList.add('hidden');
    }
});
</script>
{% endblock %}
