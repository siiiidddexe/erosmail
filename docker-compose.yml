version: '3.8'

services:
  erosmail:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DATABASE_URL=sqlite:////data/erosmail.db
      - UPLOAD_DIR=/data/uploads
    volumes:
      - erosmail_data:/data

volumes:
  erosmail_data:
